name: isucon14-static-proxy

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../isucon14/frontend/build/client:/home/isucon/webapp/public:ro
      # コンテナを作り直してもログが消えないようホスト側に出す
      - ../measure/logs:/var/log/nginx
    ports:
      - "${PROXY_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
